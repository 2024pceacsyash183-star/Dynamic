```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dynamic Blog Page</title>
</head>
<body>
    <header class="header">
        <h1>Dynamic Blog Page</h1>
        <p>Read interesting posts from our blog</p>
    </header>

    <main class="container">
        <section class="controls">
            <input type="search" id="searchinput"
                   placeholder="Search posts by title...">
            <button id="reloadButton" type="button">
                Reload Posts
            </button>
        </section>

        <p id="statusMessage" role="status" aria-live="polite">
            Loading posts...
        </p>

        <section id="postsContainer" class="posts-grid"></section>
    </main>

    <script>
        const searchInput = document.getElementById("searchinput");
        const reloadButton = document.getElementById("reloadButton");
        const postsContainer = document.getElementById("postsContainer");
        const statusMessage = document.getElementById("statusMessage");

        let posts = [];

        async function loadPosts() {
            reloadButton.disabled = true;
            statusMessage.textContent = "Loading posts...";
            postsContainer.innerHTML = "";

            try {
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/posts"
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch posts");
                }

                posts = await response.json();
                displayPosts(posts);
            } catch (error) {
                statusMessage.textContent =
                    "Unable to load posts. Please try again.";
            } finally {
                reloadButton.disabled = false;
            }
        }

        function displayPosts(data) {
            postsContainer.innerHTML = "";

            if (data.length === 0) {
                statusMessage.textContent = "No posts found.";
                return;
            }

            statusMessage.textContent = `${data.length} posts found.`;

            data.forEach(post => {
                const article = document.createElement("article");
                article.className = "post-card";

                const title = document.createElement("h2");
                title.textContent = post.title;

                const body = document.createElement("p");
                body.textContent = post.body;

                article.appendChild(title);
                article.appendChild(body);
                postsContainer.appendChild(article);
            });
        }

        searchInput.addEventListener("input", function () {
            const query = searchInput.value.trim().toLowerCase();

            const filteredPosts = posts.filter(post =>
                post.title.toLowerCase().includes(query)
            );

            displayPosts(filteredPosts);
        });

        reloadButton.addEventListener("click", loadPosts);

        loadPosts();
    </script>
</body>
</html>
```
